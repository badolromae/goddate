<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>공지사항</title>
  <meta name="description" content="따뜻한 공지사항 앱" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2b57d4" />
  <meta name="color-scheme" content="light only" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="공지사항" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 배경 장식: 펠트 느낌의 꽃과 전구 -->
  <div class="bg-decor" aria-hidden="true">
    <div class="lights">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="flower flower--tl">✿</div>
    <div class="flower flower--tr">❀</div>
    <div class="daisy daisy--1">✽</div>
    <div class="daisy daisy--2">✽</div>
    <div class="daisy daisy--3">✽</div>
  </div>

  <div class="app">
    <!-- 헤더 -->
    <div class="memberbar">
      <span id="memberName" class="memberbar__name"></span>
      <button id="memberBtn" class="memberbar__btn">로그인 · 회원가입</button>
    </div>

    <header class="header">
      <div class="header__badge">
        <span class="header__mug">☕</span>
      </div>
      <h1 class="header__title">공지사항</h1>
      <p class="header__subtitle">따뜻한 소식을 전해요</p>
      <div class="newbar" id="newbar" hidden>
        <span class="newbar__bell">🔔</span>
        <span id="newbarText">새 공지가 있어요</span>
      </div>
    </header>

    <!-- 공지 목록 -->
    <main class="board" id="board">
      <div class="skeleton" id="skeleton">
        <div class="skeleton__card"></div>
        <div class="skeleton__card"></div>
        <div class="skeleton__card"></div>
      </div>
    </main>

    <!-- 소통 버튼 (네이버 카페) -->
    <section class="talk">
      <p class="talk__label">궁금한 점이 있나요?</p>
      <a class="talk__btn" id="cafeBtn" href="#" target="_blank" rel="noopener">
        <span class="talk__icon">💬</span>
        네이버 카페에서 이야기 나누기
      </a>
    </section>

    <footer class="footer">
      <p id="footerText">사랑을 담아 전합니다</p>
    </footer>
  </div>

  <!-- 공지 상세 모달 -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" id="modalBackdrop"></div>
    <div class="modal__sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" id="modalClose" aria-label="닫기">✕</button>
      <div class="modal__pin" aria-hidden="true"></div>
      <p class="modal__date" id="modalDate"></p>
      <h2 class="modal__title" id="modalTitle"></h2>
      <div class="modal__body" id="modalBody"></div>

      <section class="comments" id="comments">
        <h3 class="comments__title">💬 댓글 <span id="commentCount"></span></h3>
        <div class="comments__list" id="commentList"></div>
        <div class="comments__write" id="commentWrite" hidden>
          <textarea id="commentInput" maxlength="500" placeholder="따뜻한 댓글을 남겨주세요 (500자까지)"></textarea>
          <button id="commentSubmit" class="comments__submit">댓글 등록</button>
        </div>
        <div class="comments__locked" id="commentLocked">
          <p>댓글은 회원만 쓸 수 있어요</p>
          <button id="commentLoginBtn" class="comments__submit">로그인 · 회원가입</button>
        </div>
      </section>
    </div>
  </div>

  <!-- 회원 로그인 / 가입 창 -->
  <div class="modal" id="authModal" hidden>
    <div class="modal__backdrop" id="authBackdrop"></div>
    <div class="modal__sheet auth" role="dialog" aria-modal="true">
      <button class="modal__close" id="authClose" aria-label="닫기">✕</button>
      <div class="auth__tabs">
        <button class="auth__tab is-on" data-tab="login">로그인</button>
        <button class="auth__tab" data-tab="signup">회원가입</button>
      </div>

      <div class="auth__form" id="loginForm">
        <label>이메일</label>
        <input id="loginEmail" type="email" autocomplete="username" placeholder="you@example.com" />
        <label>비밀번호</label>
        <input id="loginPw" type="password" autocomplete="current-password" placeholder="비밀번호" />
        <button class="auth__main" id="loginSubmit">로그인</button>
        <button class="auth__link" id="resetPwBtn">비밀번호를 잊으셨나요?</button>
      </div>

      <div class="auth__form" id="signupForm" hidden>
        <label>이름</label>
        <input id="signName" type="text" maxlength="20" placeholder="댓글에 표시될 이름" />
        <label>이메일</label>
        <input id="signEmail" type="email" autocomplete="username" placeholder="you@example.com" />
        <label>비밀번호 <small>(6자 이상)</small></label>
        <input id="signPw" type="password" autocomplete="new-password" placeholder="비밀번호" />
        <label>비밀번호 확인</label>
        <input id="signPw2" type="password" autocomplete="new-password" placeholder="비밀번호 한 번 더" />
        <button class="auth__main" id="signupSubmit">가입하기</button>
      </div>

      <p class="auth__msg" id="authMsg"></p>
    </div>
  </div>

  <!-- 설치 안내 배너 -->
  <div class="install-hint" id="installHint" hidden>
    <span id="installHintText">홈 화면에 추가하면 앱처럼 쓸 수 있어요</span>
    <button id="installHintClose" aria-label="닫기">✕</button>
  </div>

  <!-- 설정: 실제 Firebase 연동은 config.js 에서 -->
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
