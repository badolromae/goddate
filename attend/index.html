<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#B88A4A">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출석하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.ci{max-width:440px;margin:0 auto;padding:28px 18px 32px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.sheet{padding:44px 24px 28px;text-align:center}
.sheet .arch{padding:56px 22px 26px;margin-bottom:22px}
.title{font-family:var(--serif-kr);font-size:clamp(22px,6.4vw,28px);font-weight:700;margin:8px 0 0;word-break:keep-all;line-height:1.35}
.when{color:var(--muted);margin:8px 0 0;font-size:15px}
.rule{width:44px;height:1px;background:var(--gold);margin:18px auto}
label{display:block;font-weight:500;margin-bottom:8px;text-align:left}
.field{font-size:20px;padding:16px;text-align:center}
.hint{font-size:13px;color:var(--muted);margin:8px 0 22px;word-break:keep-all}
.done{padding:4px 0 8px}
.stamp{width:118px;height:118px;border-radius:50%;border:2px solid var(--rust);outline:1px solid var(--rust);outline-offset:4px;color:var(--rust);display:grid;place-items:center;margin:6px auto 22px;font-family:var(--serif-kr);font-size:26px;font-weight:700;letter-spacing:.15em;transform:rotate(-8deg)}
.who{font-family:var(--serif-kr);font-size:28px;font-weight:700;margin:0}
.at{font-size:16px;color:var(--muted);margin:4px 0 0}
.foot{padding-top:18px;text-align:center}
.loadbox{text-align:center;padding:40px 0}
.myrate{margin-top:6px}
.cat{display:inline-block;margin:12px 0 0;padding:6px 16px;border-radius:999px;background:var(--rust);color:#fff;font-weight:700;font-size:16px}
.cat.c1{background:var(--gold)}.cat.c2{background:transparent;color:var(--rust);border:1.5px solid var(--rust)}.cat.c3{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.rlabel{font-family:var(--serif-kr);font-weight:700;margin:0 0 10px}
.ring{position:relative;width:132px;height:132px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--rust);stroke-linecap:round;stroke-dasharray:314.16;stroke-dashoffset:314.16;transition:stroke-dashoffset 1s ease}
@media (prefers-reduced-motion:reduce){.ring .val{transition:none}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:34px;font-weight:600}
.rsub{color:var(--muted);margin:10px 0 8px;font-size:15px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:280px;margin:0 auto}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold)}
.dots i.on{background:var(--rust);border-color:var(--rust)}
.dots i.now{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-color-scheme:dark){.stamp{background:rgba(0,0,0,.15)}}
</style>
</head>
<body>
<main class="ci">
  <p class="muted loadbox" id="loading">불러오는 중…</p>
  <div class="card sheet" id="bad" hidden>
    <h1>출석 링크가 올바르지 않습니다</h1>
    <p class="muted">모임에서 안내한 QR을 다시 찍어 주세요.</p>
  </div>

  <div class="card sheet" id="page" hidden>
    <div class="arch">
      <p class="eyebrow">Welcome</p>
      <p class="title" id="title"></p>
      <p class="when" id="when"></p>
      <div class="rule"></div>
      <div id="msg"></div>

      <div id="form">
        <label for="name">성함</label>
        <input class="field" id="name" autocomplete="name" placeholder="실명을 입력해 주세요" maxlength="20">
        <p class="hint">한 번 입력하면 이 폰에서는 다음부터 자동으로 채워집니다.</p>
        <button class="go" id="go">출석</button>
      </div>

      <div class="done" id="done" hidden>
        <div class="stamp">출석</div>
        <p class="who" id="who"></p>
        <p class="at" id="at"></p>
        <p class="cat" id="catLine" hidden></p>
        <div class="myrate" id="myrate" hidden>
          <div class="rule"></div>
          <p class="rlabel">나의 출석률</p>
          <div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" class="trk"/><circle cx="60" cy="60" r="50" class="val" id="rArc"/></svg><b id="rPct">0%</b></div>
          <p class="rsub" id="rSub"></p>
          <div class="dots" id="rDots" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <p class="foot muted" style="font-size:13px;margin:0">출석은 한 폰에서 한 사람만 할 수 있습니다.</p>
  </div>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="../config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, serverTimestamp, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = (window.APP_CONFIG || {}).firebase;
if (!firebaseConfig) { document.body.innerHTML = '<p style="padding:40px;text-align:center">설정 파일(config.js)을 찾지 못했습니다. attend 폴더가 goddate 저장소 안에 있는지 확인해 주세요.</p>'; throw new Error('no config'); }

const $ = s => document.querySelector(s);
const ls = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
let tt; const toast=(m,err)=>{const t=$('#toast');t.textContent=m;t.classList.toggle('err',!!err);t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)};
const rid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);

const mid = new URLSearchParams(location.search).get('m');
if(!mid || !/^[A-Za-z0-9]{6,40}$/.test(mid)){ $('#loading').hidden=true; $('#bad').hidden=false; throw new Error('no meeting'); }

const db = getFirestore(initializeApp(firebaseConfig));
const doneKey = 'done:'+mid;
let meeting = null;

// 폰 고유번호: 저장공간과 쿠키 두 곳에 보관해서 한쪽을 지워도 유지
function getCookie(k){ const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)')); return m?decodeURIComponent(m[1]):null; }
function setCookie(k,v){ document.cookie=k+'='+encodeURIComponent(v)+'; max-age=63072000; path=/; SameSite=Lax'; }
function deviceId(){
  let d=ls.get('dev') || getCookie('att_dev');
  if(!d){ d=rid(); }
  ls.set('dev',d); setCookie('att_dev',d);
  return d;
}
deviceId();

// 이 폰의 출석 기록 (모임 번호 목록): 저장공간 + 쿠키 두 곳에 보관
function getHist(){
  const h=new Set();
  try{ JSON.parse(ls.get('att_hist')||'[]').forEach(x=>h.add(x)); }catch(e){}
  (getCookie('att_hist')||'').split('.').filter(Boolean).forEach(x=>h.add(x));
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('done:')) h.add(k.slice(5)); } }catch(e){}
  return h;
}
function addHist(id){
  const h=getHist(); h.add(id); const arr=[...h];
  ls.set('att_hist',JSON.stringify(arr));
  setCookie('att_hist',arr.slice(-150).join('.'));
}
addHist.save=()=>{ const arr=[...getHist()]; ls.set('att_hist',JSON.stringify(arr)); setCookie('att_hist',arr.slice(-150).join('.')); };
addHist.save();

// 시간 기준 (관리자가 모임마다 정함) → 오늘 출석 구분 표시
const toMin=v=>{ if(!v) return null; const [h,m]=String(v).split(':').map(Number); return isNaN(h)?null:h*60+(m||0); };
function catOf(m,ms){
  const t=m.times||{}; const t1=toMin(t.t1),t2=toMin(t.t2),t3=toMin(t.t3);
  if(t1==null&&t2==null&&t3==null) return null;
  const mins=Math.floor((ms-new Date((m.date||'')+'T00:00'))/60000);
  if(t1!=null&&mins<=t1) return 0; if(t2!=null&&mins<=t2) return 1; if(t3!=null&&mins>t3) return 3; return 2;
}
function showCat(done){
  const el=$('#catLine'); if(!done||!done.ms||!meeting){ el.hidden=true; return; }
  const c=catOf(meeting,done.ms); if(c==null){ el.hidden=true; return; }
  const names=['정시출석','모임시작전출석','모임시작후출석'], p=meeting.pts||{}, pts=[p.p1??5,p.p2??3,p.p3??1];
  const l=c===3?'출석 (인정 시간 이후)':(((meeting.labels||{})['l'+(c+1)]||'').trim()||names[c])+' · +'+pts[c]+'점';
  el.textContent=l; el.className='cat c'+c; el.hidden=false;
}

// 나의 출석률: 통계에 들어가는 모임(오늘까지) 중 이 폰으로 출석한 횟수
let rateShown=false;
async function showRate(){
  if(rateShown) return; rateShown=true;
  try{
    const today=new Date().toLocaleDateString('sv-SE');
    const ms=(await getDocs(collection(db,'meetings'))).docs.map(d=>({id:d.id,...d.data()}))
      .filter(m=>m.id===mid || (!m.noStats && (m.date||'')<=today))
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const h=getHist(); h.add(mid);
    const hit=ms.filter(m=>h.has(m.id)).length, total=ms.length;
    const pct=total?Math.round(hit/total*100):0;
    $('#rPct').textContent=pct+'%';
    $('#rSub').textContent='모임 '+total+'회 중 '+hit+'회 출석했어요';
    $('#rDots').innerHTML=ms.map(m=>'<i class="'+(h.has(m.id)?'on':'')+(m.id===mid?' now':'')+'" title="'+(m.date||'')+'"></i>').join('');
    $('#myrate').hidden=false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ $('#rArc').style.strokeDashoffset=String(314.16*(1-pct/100)); }));
  }catch(e){ rateShown=false; }
}

function render(){
  $('#loading').hidden=true; $('#page').hidden=false;
  $('#title').textContent = meeting.title || '출석';
  $('#when').textContent = meeting.date ? new Date(meeting.date+'T00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'}) : '';
  const done = JSON.parse(ls.get(doneKey)||'null');
  $('#form').hidden=!!done; $('#done').hidden=!done;
  $('#msg').innerHTML='';
  if(done){ $('#who').textContent=done.name+' 님'; $('#at').textContent=done.time+' 출석 완료'; showCat(done); addHist(mid); showRate(); }
  else if(meeting.open===false){ $('#msg').innerHTML='<p class="msg warn">출석이 마감되었습니다.</p>'; $('#go').disabled=true; }
  else $('#go').disabled=false;
}

onSnapshot(doc(db,'meetings',mid), s=>{
  if(!s.exists()){ $('#loading').hidden=true; $('#page').hidden=true; $('#bad').hidden=false; return; }
  meeting=s.data(); render();
}, ()=>{ $('#loading').textContent='연결하지 못했습니다. 잠시 후 새로고침해 주세요.'; });

const saved = ls.get('myname'); if(saved) $('#name').value=saved;

async function go(){
  const name=$('#name').value.trim();
  if(!name){ toast('실명을 입력해 주세요',true); $('#name').focus(); return; }
  $('#go').disabled=true;
  try{
    await setDoc(doc(db,'meetings',mid,'attendees',deviceId()), { name, at: serverTimestamp() });
    ls.set('myname',name);
    ls.set(doneKey, JSON.stringify({ name, ms: Date.now(), time: new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) }));
    if(navigator.vibrate) navigator.vibrate(80);
    render();
  }catch(e){
    if(e.code==='permission-denied'){
      if(!(meeting && meeting.open===false)) addHist(mid);
      toast(meeting && meeting.open===false ? '출석이 마감되었습니다' : '이 폰으로는 이미 출석했습니다. 한 폰에서 한 사람만 출석할 수 있어요.', true);
    } else toast('출석하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.', true);
    $('#go').disabled=false;
  }
}
$('#go').addEventListener('click',go);
$('#name').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
</script>
</body>
</html>
