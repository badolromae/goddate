<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>공지 관리 (관리자 전용)</title>

  <!-- 관리자 앱(PWA) 설치 정보 -->
  <link rel="manifest" href="admin-manifest.json" />
  <meta name="theme-color" content="#e8703f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="공지관리" />
  <link rel="apple-touch-icon" href="icons/admin-192.png" />

  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue:#2b57d4; --deep:#1f3fa8; --cream:#fbf6ec;
      --peach:#f0a869; --coral:#e8703f; --ink:#3a3730; --white:#fdfbf7;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Gaegu',sans-serif; background:var(--blue); color:var(--ink);
      min-height:100vh; padding:24px 16px;
    }
    .wrap { max-width:620px; margin:0 auto; }
    h1 { font-family:'Jua',sans-serif; color:var(--white); font-size:30px; text-align:center; margin-bottom:6px; }
    .sub { text-align:center; color:var(--peach); font-size:17px; margin-bottom:22px; }
    .panel {
      background:var(--cream); border-radius:22px; padding:22px;
      box-shadow:0 8px 24px rgba(20,40,110,0.25); margin-bottom:18px;
      border:2px solid var(--white);
    }
    label { display:block; font-size:18px; font-weight:700; margin:12px 0 6px; }
    input, textarea {
      width:100%; font-family:'Gaegu',sans-serif; font-size:18px;
      padding:12px 14px; border:2px solid #e5ddcb; border-radius:14px;
      background:#fffdf8; color:var(--ink);
    }
    input:focus, textarea:focus { outline:none; border-color:var(--peach); }
    textarea { min-height:140px; resize:vertical; line-height:1.5; }
    .row { display:flex; align-items:center; gap:8px; margin-top:12px; }
    .row input[type=checkbox] { width:auto; }
    .row label { margin:0; }
    button {
      font-family:'Jua',sans-serif; font-size:19px; cursor:pointer;
      border:none; border-radius:999px; padding:13px 26px; color:#fff;
      transition:transform .15s ease;
    }
    button:active { transform:scale(0.96); }
    .btn-main { background:var(--peach); box-shadow:inset 0 -3px 0 rgba(180,90,30,0.35); width:100%; margin-top:18px; }
    .btn-danger { background:#d05a5a; font-size:15px; padding:8px 16px; }
    .btn-edit { background:var(--peach); font-size:15px; padding:8px 16px; }
    .linkrow { display:flex; gap:8px; margin-bottom:8px; }
    .linkrow .linkTitle { flex:0 0 40%; }
    .linkrow .linkUrl { flex:1; }
    .btn-ghost { background:var(--deep); font-size:15px; padding:8px 16px; }
    .login-box { max-width:380px; margin:60px auto; }
    .hidden { display:none !important; }
    .notice-item {
      display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
      padding:14px; border-radius:14px; background:#fffdf8; margin-bottom:10px;
      border:1px solid #eee3cf;
    }
    .notice-item h3 { font-family:'Jua',sans-serif; font-size:18px; }
    .notice-item .meta { font-size:14px; color:var(--peach); }
    .msg { text-align:center; padding:10px; border-radius:12px; margin-top:12px; font-size:16px; }
    .msg.ok { background:#dff3e0; color:#2e7d43; }
    .msg.err { background:#fadddd; color:#b93b3b; }
    .demo-warn {
      background:#fff3d6; color:#8a6d1f; padding:12px 14px; border-radius:14px;
      font-size:15px; margin-bottom:16px; line-height:1.5;
    }
    .logout { position:absolute; top:20px; right:20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>공지 관리</h1>
    <p class="sub">관리자 전용 페이지예요 🔒</p>

    <div id="demoWarn" class="demo-warn hidden">
      ⚠️ 아직 Firebase가 연결되지 않았어요. config.js 를 채우면 실제로 공지를 저장할 수 있어요.
      지금은 미리보기(로그인·저장 불가) 상태예요.
    </div>

    <!-- 로그인 -->
    <div id="loginPanel" class="panel login-box">
      <label>관리자 이메일</label>
      <input id="email" type="email" placeholder="admin@example.com" autocomplete="username" />
      <label>비밀번호</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      <div class="row" style="margin-top:14px;">
        <input id="keepLogin" type="checkbox" />
        <label for="keepLogin">이 기기에서 자동 로그인 유지</label>
      </div>
      <p style="font-size:13px;color:#8a8272;margin:6px 0 2px;line-height:1.5;">
        체크하면 이 기기는 계속 로그인돼요. 체크 안 하면 창을 닫을 때 자동 로그아웃돼요.
      </p>
      <button class="btn-main" id="loginBtn">로그인</button>
      <div id="loginMsg"></div>
    </div>

    <!-- 공지 작성 -->
    <div id="adminPanel" class="hidden">
      <button class="btn-ghost logout" id="logoutBtn">로그아웃</button>

      <div class="panel">
        <h2 id="formTitle" style="font-family:'Jua';font-size:21px;margin-bottom:4px;">새 공지 쓰기 ✍️</h2>
        <label>제목</label>
        <input id="nTitle" type="text" placeholder="공지 제목을 입력하세요" />
        <label>내용</label>
        <textarea id="nBody" placeholder="공지 내용을 입력하세요.&#10;줄바꿈도 그대로 보여져요.&#10;주소(https://...)를 적으면 링크로 눌러서 이동할 수 있어요."></textarea>
        <label>사진 <span style="font-weight:400;font-size:15px;color:#8a8272;">(선택 · 없으면 비워두세요)</span></label>
        <input id="nImageFile" type="file" accept="image/*" />
        <p style="font-size:14px;color:#8a8272;margin-top:6px;line-height:1.5;">
          💡 휴대폰이나 컴퓨터에서 사진 파일을 고르면 공지에 함께 올라가요.
        </p>
        <div id="imgPreview" style="margin-top:10px;"></div>

        <label>링크 버튼 <span style="font-weight:400;font-size:15px;color:#8a8272;">(선택 · 제목과 주소를 넣으면 공지에 버튼으로 떠요)</span></label>
        <div class="linkrow">
          <input class="linkTitle" type="text" placeholder="버튼 이름 (예: 신청서)" />
          <input class="linkUrl" type="url" placeholder="https://..." />
        </div>
        <div class="linkrow">
          <input class="linkTitle" type="text" placeholder="버튼 이름 (예: 프로필)" />
          <input class="linkUrl" type="url" placeholder="https://..." />
        </div>
        <div class="linkrow">
          <input class="linkTitle" type="text" placeholder="버튼 이름 (선택)" />
          <input class="linkUrl" type="url" placeholder="https://..." />
        </div>

        <label>날짜</label>
        <input id="nDate" type="date" />
        <div class="row">
          <input id="nPinned" type="checkbox" />
          <label for="nPinned">📌 맨 위에 고정하기</label>
        </div>
        <button class="btn-main" id="saveBtn">공지 올리기</button>
        <button class="btn-ghost" id="cancelEditBtn" style="width:100%;margin-top:8px;display:none;">수정 취소</button>
        <div id="saveMsg"></div>
      </div>

      <div class="panel">
        <h2 style="font-family:'Jua';font-size:21px;margin-bottom:12px;">올린 공지 목록</h2>
        <div id="list">불러오는 중…</div>
      </div>
    </div>
  </div>

  <!-- 관리자 앱 설치 안내 -->
  <div class="install-hint" id="installHint" hidden
       style="position:fixed;left:12px;right:12px;bottom:12px;z-index:60;max-width:560px;margin:0 auto;
              background:var(--white);border-radius:18px;padding:14px 16px;display:flex;
              align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--ink);
              box-shadow:0 10px 30px rgba(20,40,110,0.28);">
    <span id="installHintText">홈 화면에 추가하면 관리자 앱으로 쓸 수 있어요</span>
    <button id="installHintClose" aria-label="닫기"
      style="border:none;background:var(--peach);color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;flex-shrink:0;">✕</button>
  </div>

  <script src="config.js"></script>
  <script type="module" src="admin.js"></script>
  <script>
    // 관리자 앱도 오프라인/설치가 되도록 서비스워커 등록
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
    // 설치 안내 (아이폰 사파리 / 안드로이드 크롬)
    (function () {
      const hint = document.getElementById("installHint");
      const closeBtn = document.getElementById("installHintClose");
      const hintText = document.getElementById("installHintText");
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
      const dismissed = localStorage.getItem("adminInstallHintDismissed");
      if (standalone || dismissed) return;
      if (isIOS) {
        hintText.textContent = "공유 버튼 → '홈 화면에 추가'로 관리자 앱 설치";
        setTimeout(() => { hint.hidden = false; }, 1500);
      }
      let deferred;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault(); deferred = e;
        hintText.textContent = "홈 화면에 추가하면 관리자 앱으로 쓸 수 있어요";
        hint.hidden = false; hint.style.cursor = "pointer";
        hint.addEventListener("click", async (ev) => {
          if (ev.target === closeBtn) return;
          hint.hidden = true; deferred.prompt(); deferred = null;
        });
      });
      closeBtn.addEventListener("click", () => {
        hint.hidden = true; localStorage.setItem("adminInstallHintDismissed", "1");
      });
    })();
  </script>
</body>
</html>
