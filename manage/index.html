<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#CE5974">
<title>갓데이트 관리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="갓데이트 관리">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#CE5974; --rose-deep:#A93F5A; --rose-soft:#F7DCE3;
  --paper:#FDFCFF; --grid:#DCE3F2; --ink:#3B2430; --muted:#7D6670;
  --c-notice:#3E6FD8; --c-attend:#9C4A2A; --c-pick:#1F5A3F;
  --round:"Jua","Gowun Dodum",sans-serif;
  --sans:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--rose);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}

.wrap{max-width:480px;margin:0 auto;padding:18px 16px 28px;min-height:100vh;display:flex;flex-direction:column}

/* 모눈종이 시트 — 로고의 하얀 원과 모눈 배경을 옮겨 온 부분 */
.sheet{position:relative;margin-top:96px;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;
  border-radius:200px 200px 28px 28px;padding:112px 18px 22px;box-shadow:0 14px 0 var(--rose-deep)}
.logo{position:absolute;left:50%;top:-86px;transform:translateX(-50%);width:180px;height:180px;border-radius:50%;
  border:8px solid var(--rose);background:var(--rose);box-shadow:0 0 0 3px #fff}
.logo img{width:100%;height:100%;border-radius:50%;display:block}

/* 로고처럼 속이 빈 분홍 테두리 글씨 */
h1{margin:0;text-align:center;font-family:var(--round);font-weight:400;font-size:44px;line-height:1.1;letter-spacing:.02em;
  color:#fff;-webkit-text-stroke:7px var(--rose);paint-order:stroke fill;text-shadow:0 3px 0 rgba(169,63,90,.25)}
.lead{text-align:center;margin:10px 0 22px;color:var(--muted);font-size:15px}

.menu{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:14px;background:#fff;border:3px solid var(--rose);
  border-radius:22px;padding:14px 16px 14px 14px;box-shadow:0 5px 0 var(--rose-soft);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rose-soft)}
.badge{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff}
.badge svg{width:32px;height:32px}
.b-notice{background:var(--c-notice)}.b-attend{background:var(--c-attend)}.b-pick{background:var(--c-pick)}
.tile b{display:block;font-family:var(--round);font-weight:400;font-size:24px;line-height:1.2;color:var(--ink)}
.tile small{display:block;color:var(--muted);font-size:14px;margin-top:2px;word-break:keep-all}
.go{width:34px;height:34px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center}
.go svg{width:16px;height:16px}

.notice-wrap{display:grid;gap:8px}
.view{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 14px;
  background:var(--rose-soft);color:var(--rose-deep);font-weight:700;font-size:15px;border:2px dashed var(--rose)}
.view svg{width:18px;height:18px}

.foot{margin-top:auto;padding-top:22px;text-align:center;color:#FFE8EE;font-size:13px;line-height:1.6;word-break:keep-all}

@media (prefers-reduced-motion:reduce){.tile{transition:none}}
@media (max-width:360px){h1{font-size:38px}.tile{grid-template-columns:52px 1fr auto}.badge{width:52px;height:52px}.tile b{font-size:21px}}

/* 다크 모드: 브라우저가 색을 억지로 바꾸지 않도록 밤 버전 제공 */
@media (prefers-color-scheme:dark){
  :root{--rose:#B84A64;--rose-deep:#7E2E44;--rose-soft:#4A2533;--paper:#2A1E24;--grid:#3A2B33;--ink:#F7E9EE;--muted:#CDB3BE}
  .tile{background:#33242B}
  h1{color:#2A1E24;-webkit-text-stroke-color:#F08AA3}
  .view{color:#F7C3D0}
}
</style>
</head>
<body>
<main class="wrap">
  <section class="sheet">
    <div class="logo"><img src="logo.png" alt="갓데이트"></div>
    <h1>갓데이트 관리</h1>
    <p class="lead">무엇을 관리할까요?</p>

    <nav class="menu" aria-label="관리 선택">
      <div class="notice-wrap">
        <a class="tile" href="../admin/">
          <span class="badge b-notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4a1 1 0 0 0 1 1h2l5 4V5L7 9H5a1 1 0 0 0-1 1z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></span>
          <span><b>공지 관리</b><small>공지 쓰기 · 회원 · 통계</small></span>
          <span class="go" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span>
        </a>
        <a class="view" href="../">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          공지 보러 가기
        </a>
      </div>

      <a class="tile" href="../attend/admin.html">
        <span class="badge b-attend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M4 10h16"/><path d="M9 15l2 2 4-4"/></svg></span>
        <span><b>출석부 관리</b><small>출석 QR · 명단 · 순위</small></span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span>
      </a>

      <a class="tile" href="../drink/admin.html">
        <span class="badge b-pick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M11 7h9M11 17h9"/><circle cx="6" cy="12" r="2.6" fill="currentColor"/><path d="M11 12h9"/></svg></span>
        <span><b>선택 신청 관리</b><small>음료 주문 등 · 집계 인쇄</small></span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></span>
      </a>
    </nav>
  </section>

  <p class="foot">한 번 로그인하면 세 가지 관리 모두 같은 계정으로 이어서 쓸 수 있어요.<br>관리 화면에서 돌아올 때는 폰의 뒤로 가기를 누르세요.</p>
</main>
<script>if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }</script>
</body>
</html>
